global:
  imagePullSecrets: []
  image:
    imagePullPolicy: Always
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        sectionName: https
    hostnames:
      - 'farmsuite.org'
  tls:
    configMapName: ""

# Imagen usada por el initContainer que genera el truststore JVM a partir de los
# certificados en global.tls.certificates (necesita `keytool`; la imagen final del
# contenedor principal es distroless y no lo tiene).
tls:
  truststoreInitImage: "eclipse-temurin:21-jre"
  truststorePassword: "changeit"

replicaCount: 1

image:
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "1Gi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

livenessProbe:
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  initialDelaySeconds: 90
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

# Índice Lucene de Hibernate Search (hibernate.search.backend.directory.root en
# applicationYaml, /tmp/lucenefiles). Sin esto, cada reinicio del pod lo borra y
# hay que llamar a $reindex-terminology a mano para que $expand/$validate/snapshot
# con binding required vuelvan a funcionar.
persistence:
  enabled: false
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

tolerations: []

affinity: {}

http_relative_path: "/fhir"

applicationYaml: |
  server:
    port: 8080

  spring:
    main:
      allow-bean-definition-overriding: false
      allow-circular-references: true
      banner-mode: off
    autoconfigure:
      exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
    flyway:
      enabled: false
    datasource:
      url: jdbc:postgresql://postgres-pre-postgresql.persistence-pre.svc.cluster.local:5432/farmsuite?currentSchema=fhir
      username: postgres
      password: "YYw1k4Wqae"
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
    jpa:
      properties:
        hibernate:
          format_sql: false
          show_sql: false
          dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
          default_schema: fhir
          hbm2ddl:
            auto: update

  hapi:
    fhir:
      fhir_version: R5
      openapi_enabled: true
      narrative_enabled: false
      bulk_export_enabled: false
      bulk_import_enabled: false
      mdm_enabled: false
      ig_runtime_upload_enabled: false
      search-coord-core-pool-size: 20
      search-coord-max-pool-size: 100
      search-coord-queue-capacity: 200
      search_prefetch_thresholds: 13,503,2003,-1
      cors:
        allowed_origin:
          - "*"
      cr:
        enabled: false
      cdshooks:
        enabled: false
      logical_urls:
        - http://terminology.hl7.org/*
        - https://terminology.hl7.org/*
        - http://snomed.info/*
        - https://snomed.info/*
        - http://unitsofmeasure.org/*
        - https://unitsofmeasure.org/*
        - http://loinc.org/*
        - https://loinc.org/*

  sso:
    oidc:
      public-paths:
        - /fhir/swagger-ui/**
        - /fhir/api-docs/**
        - /fhir/metadata

  cors:
    allowed-origins:
      - "*"

  logging:
    level:
      root: INFO
