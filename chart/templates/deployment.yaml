apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        timestamp: {{ now | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tls.configMapName }}
      initContainers:
        - name: init-truststore
          image: {{ .Values.tls.truststoreInitImage }}
          command:
            - sh
            - -c
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              for cert in /tls-certs/*.crt; do
                keytool -importcert -noprompt -trustcacerts \
                  -alias "$(basename "$cert" .crt)" \
                  -file "$cert" \
                  -keystore /truststore/cacerts \
                  -storepass "{{ .Values.tls.truststorePassword }}"
              done
          volumeMounts:
            - name: tls-certs
              mountPath: /tls-certs
              readOnly: true
            - name: truststore
              mountPath: /truststore
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "onsystem/hapi-fhir:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.imagePullPolicy }}
          {{- if .Values.global.tls.configMapName }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword={{ .Values.tls.truststorePassword }}"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            {{- with .Values.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            {{- with .Values.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            {{- if .Values.global.tls.configMapName }}
            - name: truststore
              mountPath: /truststore
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: lucene-index
              mountPath: /tmp/lucenefiles
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "chart.fullname" . }}
        {{- if .Values.global.tls.configMapName }}
        - name: tls-certs
          configMap:
            name: {{ .Values.global.tls.configMapName }}
        - name: truststore
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: lucene-index
          persistentVolumeClaim:
            claimName: {{ include "chart.fullname" . }}-lucene
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
