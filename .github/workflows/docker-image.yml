name: Docker Image — hapi-fhir-jpaserver-starter

# Empuja a onsystem/hapi-fhir-jpaserver-starter (namespace propio de FarmSuite),
# NO al docker.io/hapiproject/hapi que usa build-images.yaml (ese es del upstream).

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la imagen a publicar"
        required: true
        type: string

jobs:
  docker:
    uses: Farm-Suite/Infra/.github/workflows/docker-image.yml@main
    with:
      image_name: onsystem/hapi-fhir-jpaserver-starter
      build_mode: dockerfile
      dockerfile_target: default
      manual_tag: ${{ inputs.tag }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
