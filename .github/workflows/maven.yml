# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "charts/**"

jobs:
  build:

    runs-on: ubuntu-latest

    # .mvn/settings.xml autentica contra GitHub Packages (Farm-Suite/SSO) con
    # GITHUB_ACTOR/GITHUB_TOKEN. El GITHUB_TOKEN automático no puede leer paquetes
    # de otro repo del org: se usa el PAT GH_PACKAGES_TOKEN (read:packages).
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: zulu
    - name: Build with Maven
      run: mvn -B package --file pom.xml verify
