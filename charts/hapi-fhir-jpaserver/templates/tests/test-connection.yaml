apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hapi-fhir-jpaserver.fullname" . }}-test-connection"
  labels:
    {{- include "hapi-fhir-jpaserver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "hapi-fhir-jpaserver.fullname" . }}:{{ .Values.service.port }}{{ .Values.http_relative_path }}']
  restartPolicy: Never
